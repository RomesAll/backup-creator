services:
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGODB__USERNAME
      MONGO_INITDB_ROOT_PASSWORD: $MONGODB__PASSWORD

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: $MONGODB__EXPRESS_URL
      ME_CONFIG_BASICAUTH_ENABLED: $MONGODB__BASICAUTH_ENABLED
      ME_CONFIG_BASICAUTH_USERNAME: $MONGODB__BASICAUTH_USERNAME
      ME_CONFIG_BASICAUTH_PASSWORD: $MONGODB__BASICAUTH_PASSWORD
